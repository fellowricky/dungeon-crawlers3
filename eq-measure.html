<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="./src/ui/styles.css" />
  <link rel="stylesheet" href="./src/ui/game.css" />
  <link rel="stylesheet" href="./src/ui/ui_kit.css" />
</head>
<body>
<div id="charscreen" class="show" style="position:relative;width:1643px;height:1021px">
  <div class="cs-frame">
    <div class="cs-body">
      <div class="cs-rail"></div>
      <div class="cs-main" style="height:820px">
        <div class="cs-hero">
          <div class="cs-doll">
            <div class="eq-col">
              <div class="eq-slot filled" data-k="helm"><span class="eq-ico"><img class="item-ico" src="./dcss/item/armor/headgear/cap_2.png"></span><span class="eq-slotlabel">Helm</span></div>
              <div class="eq-slot filled" data-k="amulet"><span class="eq-ico"><img class="item-ico" src="./dcss/item/amulet/celtic_yellow.png"></span><span class="eq-slotlabel">Amulet</span></div>
              <div class="eq-slot filled" data-k="armor"><span class="eq-ico"><img class="item-ico" src="./dcss/item/armor/torso/scale_mail_1.png"></span><span class="eq-slotlabel">Armor</span></div>
              <div class="eq-slot filled" data-k="gloves"><span class="eq-ico"><img class="item-ico" src="./dcss/item/armor/hands/gauntlet_1.png"></span><span class="eq-slotlabel">Gloves</span></div>
            </div>
            <div class="cs-portrait"><div class="pt-art"><canvas class="pt-canvas" width="64" height="64"></canvas></div><div class="pt-name">Elodin</div></div>
            <div class="eq-col">
              <div class="eq-slot filled" data-k="weapon"><span class="eq-ico"><img class="item-ico" src="./dcss/item/weapon/ranged/shortbow_1.png"></span><span class="eq-slotlabel">Weapon</span></div>
              <div class="eq-slot filled" data-k="offhand"><span class="eq-ico"><img class="item-ico" src="./dcss/item/weapon/long_sword_1.png"></span><span class="eq-slotlabel">Off-hand</span></div>
              <div class="eq-slot filled" data-k="boots"><span class="eq-ico"><img class="item-ico" src="./dcss/item/armor/feet/boots_1_brown_new.png"></span><span class="eq-slotlabel">Boots</span></div>
              <div class="eq-slot filled" data-k="trinket"><span class="eq-ico"><img class="item-ico" src="./dcss/item/scroll/scroll-brown.png"></span><span class="eq-slotlabel">Trinket</span></div>
            </div>
            <div class="eq-row">
              <div class="eq-slot filled" data-k="ring"><span class="eq-ico"><img class="item-ico" src="./dcss/item/ring/ring_gold_white.png"></span><span class="eq-slotlabel">Ring</span></div>
            </div>
          </div>
        </div>
        <div class="cs-bag"><h3>Bag</h3><div class="bag-grid"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
