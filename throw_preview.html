<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thrown Weapon Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #090a10; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8dcc0; }
    #hud { position: fixed; top: 12px; left: 12px; z-index: 5; background: rgba(12,13,20,.85); border: 1px solid #3a3226; border-radius: 6px; padding: 10px 12px; max-width: 320px; }
    #hud h1 { font-size: 15px; margin: 0 0 6px; color: #f0c860; }
    #now { font-size: 18px; margin: 6px 0; color: #fff; }
    #weapons button { margin: 2px; background: #241f18; color: #e8dcc0; border: 1px solid #5a4a30; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
    #weapons button.on { background: #6a4e1c; }
    label { display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Thrown weapons</h1>
    <div id="now">—</div>
    <div id="weapons"></div>
    <label><input type="checkbox" id="cycle" checked> cycle through all weapons</label>
    <label><input type="checkbox" id="slow"> half speed</label>
    <div style="opacity:.7;margin-top:6px">Each weapon throws twice: a hit, then a miss.</div>
  </div>
  <script type="module" src="/src/throw_preview.js"></script>
</body>
</html>
