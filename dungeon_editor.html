<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawlers — Dungeon &amp; Overland Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-dark:#090b12; --bg-panel:#111422; --bg-card:#181c2e; --bg-input:#0e101a;
      --border:rgba(255,255,255,.08); --border-bright:rgba(217,164,65,.3);
      --text-main:#e2e4f0; --text-muted:#8e95b0;
      --gold:#d9a441; --gold-bright:#fcd34d;
      --red:#ef4444; --green:#10b981; --blue:#3b82f6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Outfit',system-ui,sans-serif;background:var(--bg-dark);color:var(--text-main);
      overflow:hidden;height:100vh;
    }
    /* the shared renderer appends its canvas to body and sizes to the window */
    body > canvas{position:fixed;inset:0;z-index:0}

    #panel{
      position:fixed;top:0;right:0;bottom:0;width:398px;z-index:10;
      background:rgba(17,20,34,.94);backdrop-filter:blur(8px);
      border-left:1px solid var(--border);display:flex;flex-direction:column;
    }
    #panel.collapsed{transform:translateX(calc(100% - 34px))}
    #collapse{
      position:absolute;left:-1px;top:14px;width:34px;height:34px;transform:translateX(-100%);
      background:rgba(17,20,34,.94);border:1px solid var(--border);border-right:none;
      border-radius:6px 0 0 6px;color:var(--gold);cursor:pointer;font-size:15px;
    }
    header{padding:12px 14px 10px;border-bottom:1px solid var(--border)}
    header h1{font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--gold)}
    header p{font-size:11px;color:var(--text-muted);margin-top:2px}

    #tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border)}
    .tab{
      flex:1 1 auto;padding:5px 9px;font-size:11px;font-weight:500;letter-spacing:.03em;
      background:var(--bg-card);border:1px solid var(--border);border-radius:5px;
      color:var(--text-muted);cursor:pointer;text-transform:uppercase;
    }
    .tab.on{color:var(--bg-dark);background:var(--gold);border-color:var(--gold);font-weight:600}

    #body{flex:1;overflow-y:auto;padding:10px 12px 90px}
    #body::-webkit-scrollbar{width:8px}
    #body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

    .group{margin-bottom:14px}
    .group > h2{
      font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);
      margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)
    }
    .row{display:flex;align-items:center;gap:8px;margin-bottom:5px;min-height:24px}
    .row > label{flex:0 0 128px;font-size:11.5px;color:var(--text-muted)}
    .row > .ctl{flex:1;display:flex;align-items:center;gap:6px}
    .row .val{flex:0 0 46px;text-align:right;font-size:11px;color:var(--text-main);font-variant-numeric:tabular-nums}
    input[type=range]{flex:1;height:3px;accent-color:var(--gold);background:var(--bg-input)}
    input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--border);background:none;border-radius:4px;cursor:pointer}
    input[type=text],input[type=number],select{
      flex:1;min-width:0;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;
      color:var(--text-main);font-family:inherit;font-size:11.5px;padding:3px 6px
    }
    .hex{flex:0 0 74px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px}
    button{
      font-family:inherit;font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:5px;
      background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);cursor:pointer
    }
    button:hover{border-color:var(--border-bright)}
    button.primary{background:var(--gold);border-color:var(--gold);color:#1a1206;font-weight:600}
    button.ghost{background:none}
    .btnrow{display:flex;gap:6px;margin:8px 0}
    .btnrow button{flex:1}
    .hint{font-size:10.5px;color:var(--text-muted);line-height:1.45;margin:4px 0 8px}
    .swatch{width:100%;height:38px;border-radius:5px;border:1px solid var(--border);image-rendering:pixelated}

    #footer{
      position:absolute;left:0;right:0;bottom:0;padding:9px 12px;
      background:rgba(11,13,22,.97);border-top:1px solid var(--border)
    }
    #status{font-size:10.5px;color:var(--text-muted);min-height:14px;margin-top:5px}
    #status.ok{color:var(--green)} #status.err{color:var(--red)}

    #hud{
      position:fixed;left:14px;top:12px;z-index:5;font-size:11.5px;color:var(--text-muted);
      background:rgba(11,13,22,.7);border:1px solid var(--border);border-radius:6px;padding:7px 11px;
      backdrop-filter:blur(6px);pointer-events:none
    }
    #hud b{color:var(--gold);font-weight:600}
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <div id="panel">
    <button id="collapse" title="Collapse">›</button>
    <header>
      <h1>DUNGEON &amp; OVERLAND EDITOR</h1>
      <p>Tune themes live — saves to theme_overrides.json</p>
    </header>
    <div id="tabs"></div>
    <div id="body"></div>
    <div id="footer">
      <div class="btnrow">
        <button class="primary" id="save">Save to project</button>
        <button id="copy">Copy JSON</button>
        <button class="ghost" id="revert" title="Discard this theme's unsaved edits">Revert</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <script type="module" src="/src/dungeon_editor.js"></script>
</body>
</html>
