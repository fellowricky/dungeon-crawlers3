<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawlers — Dev Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090b12;
      --bg-panel: #111422;
      --bg-card: #181c2e;
      --bg-card-hover: #1d2236;
      --bg-input: #0e101a;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(217, 164, 65, 0.3);
      --text-main: #e2e4f0;
      --text-muted: #8e95b0;
      --gold: #d9a441;
      --gold-bright: #fcd34d;
      --gold-glow: rgba(217, 164, 65, 0.2);
      --red: #ef4444;
      --green: #10b981;
      --blue: #3b82f6;
      --violet: #8b5cf6;
      --cyan: #06b6d4;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image:
        radial-gradient(1200px 500px at 50% -10%, rgba(217, 164, 65, 0.07), transparent 60%),
        radial-gradient(900px 400px at 90% 110%, rgba(139, 92, 246, 0.06), transparent 60%);
      background-attachment: fixed;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    header.hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .kicker {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--gold);
      border: 1px solid var(--border-bright);
      border-radius: 999px;
      padding: 6px 16px;
      margin-bottom: 16px;
      background: rgba(217, 164, 65, 0.06);
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .sub {
      color: var(--text-muted);
      font-weight: 300;
      font-size: 15px;
      max-width: 620px;
      margin: 0 auto;
    }

    .search {
      margin-top: 26px;
      display: flex;
      justify-content: center;
    }

    #filter {
      width: min(420px, 100%);
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 18px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #filter::placeholder { color: var(--text-muted); }
    #filter:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .group { margin-bottom: 36px; }

    .group h2 {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-left: 2px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      background: var(--bg-card-hover);
      border-color: var(--border-bright);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 3px var(--gold-glow);
      outline: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
    }

    .card h3 {
      font-size: 17px;
      font-weight: 600;
      margin-top: 4px;
    }

    .card p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      font-weight: 300;
    }

    .card .file {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--cyan);
      opacity: 0.85;
    }

    .card .go {
      margin-top: auto;
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .card:hover .go, .card:focus-visible .go { opacity: 1; }

    .accent-blue .icon { border-color: rgba(59, 130, 246, 0.35); background: rgba(59, 130, 246, 0.1); }
    .accent-violet .icon { border-color: rgba(139, 92, 246, 0.35); background: rgba(139, 92, 246, 0.1); }
    .accent-cyan .icon { border-color: rgba(6, 182, 212, 0.35); background: rgba(6, 182, 212, 0.1); }
    .accent-green .icon { border-color: rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.1); }
    .accent-red .icon { border-color: rgba(239, 68, 68, 0.35); background: rgba(239, 68, 68, 0.1); }
    .accent-amber .icon { border-color: rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.1); }

    .empty {
      display: none;
      text-align: center;
      color: var(--text-muted);
      padding: 48px 0;
      font-size: 14px;
      font-weight: 300;
    }

    .count {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 300;
      margin-bottom: 24px;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 300;
      margin-top: 40px;
    }

    @media (max-width: 700px) {
      .wrap { padding: 28px 16px 48px; }
      .grid { grid-template-columns: 1fr; }
      .card .go { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="kicker">DEV HUB</span>
      <h1>DUNGEON CRAWLERS</h1>
      <p class="sub">Every editor, balancer, and content tool in one place — pick one and jump straight in.</p>
      <div class="search">
        <input id="filter" type="search" placeholder="Search tools… (e.g. loot, sound, xp)" autocomplete="off" aria-label="Search tools">
      </div>
    </header>

    <div id="count" class="count"></div>

    <div id="grids"></div>

    <div id="empty" class="empty">No tools match that search.</div>

    <footer>Dungeon Crawlers — developer tool hub · all tools open in a new tab</footer>
  </div>

  <script>
    const GROUPS = [
      {
        name: "Content & Balance Editors",
        tools: [
          {
            title: "Bestiary & Color Balance",
            desc: "Browse monsters, tune stats, and balance sprite colors against the dungeon palette.",
            href: "bestiary.html",
            file: "bestiary.html",
            accent: "accent-red",
            icon: "🐉",
            tags: ["bestiary", "monster", "stats", "color", "balance"],
          },
          {
            title: "Loot & Item Development Kit",
            desc: "Design items, weapons, armor, and loot tables for the whole campaign.",
            href: "loot_editor.html",
            file: "loot_editor.html",
            accent: "accent-amber",
            icon: "🎁",
            tags: ["loot", "item", "equipment", "weapon", "armor"],
          },
          {
            title: "Sound Editor",
            desc: "Manage SFX, ambient loops, and audio cues used across the game.",
            href: "sound_editor.html",
            file: "sound_editor.html",
            accent: "accent-cyan",
            icon: "🔊",
            tags: ["sound", "audio", "sfx", "music"],
          },
          {
            title: "Gold Balancer & Loot Simulator",
            desc: "Simulate gold rewards and balance economy progression.",
            href: "gold_balancer.html",
            file: "gold_balancer.html",
            accent: "accent-green",
            icon: "🪙",
            tags: ["gold", "economy", "simulator", "balance", "loot"],
          },
          {
            title: "XP Balancer & Difficulty Tuner",
            desc: "Tune XP curves and difficulty pacing for quests and floors.",
            href: "xp_balancer.html",
            file: "xp_balancer.html",
            accent: "accent-violet",
            icon: "📈",
            tags: ["xp", "experience", "difficulty", "tune", "balance"],
          },
          {
            title: "VFX Animation Editor",
            desc: "Build and preview spell, combat, and UI animation effects.",
            href: "test-skills.html",
            file: "test-skills.html",
            accent: "accent-blue",
            icon: "✨",
            tags: ["vfx", "animation", "spell", "effect", "test"],
          },
        ],
      },
      {
        name: "Dungeon & World Building",
        tools: [
          {
            title: "Dungeon & Overland Editor",
            desc: "Forge procedural dungeon layouts, overland maps, and quest flow.",
            href: "dungeon_editor.html",
            file: "dungeon_editor.html",
            accent: "accent-violet",
            icon: "🏰",
            tags: ["dungeon", "overland", "map", "editor", "layout"],
          },
          {
            title: "World Map Biome Painter",
            desc: "Paint which biome each part of the world map art counts as; doorstep biomes decide where dungeons can appear.",
            href: "world_map_editor.html",
            file: "world_map_editor.html",
            accent: "accent-green",
            icon: "🗺️",
            tags: ["world", "map", "biome", "region", "paint", "overland"],
          },
          {
            title: "Dungeon Theme & Level Test Launcher",
            desc: "Select any dungeon theme and difficulty level for instant delve testing.",
            href: "index.html?testDelve=1",
            file: "index.html",
            accent: "accent-amber",
            icon: "🧪",
            tags: ["dungeon", "theme", "level", "test", "delve", "launcher"],
          },
          {
            title: "Loading Screen Recipes",
            desc: "Preview every loading plate with the weather that floor can roll: rain, fog, snow, and blizzard.",
            href: "loading_preview.html",
            file: "loading_preview.html",
            accent: "accent-cyan",
            icon: "🌧️",
            tags: ["loading", "screen", "plate", "weather", "rain", "fog", "snow", "blizzard", "preview"],
          },
          {
            title: "Trailer Rig & Camera Director",
            desc: "Filming harness and cinematic camera director with automated action shots, orbits, and MP4 rendering.",
            href: "trailer.html",
            file: "trailer.html",
            accent: "accent-cyan",
            icon: "🎥",
            tags: ["trailer", "camera", "director", "cinematic", "video"],
          },
        ],
      },
      {
        name: "Sprites & Art Tools",
        tools: [
          {
            title: "LPC Character Generator",
            desc: "Universal LPC sprite-sheet character generator for assembling hero sprites.",
            href: "lpc_repo/index.html",
            file: "lpc_repo/index.html",
            accent: "accent-blue",
            icon: "🧙",
            tags: ["lpc", "character", "sprite", "sheet", "hero", "generator"],
          },
          {
            title: "Sprite Picker",
            desc: "Browse and pick enemy sprites from the dnd_enemies collection.",
            href: "Sprites/sprite_picker/web/index.html",
            file: "Sprites/sprite_picker/web/index.html",
            accent: "accent-red",
            icon: "👹",
            tags: ["sprite", "picker", "enemy", "browse", "art"],
          },
          {
            title: "Sprite Sheet Viewer",
            desc: "Inspect raw sprite sheets and verify animation frame grids.",
            href: "Sprites/sprite_viewer.html",
            file: "Sprites/sprite_viewer.html",
            accent: "accent-cyan",
            icon: "🎞️",
            tags: ["sprite", "sheet", "viewer", "frame", "animation"],
          },
          {
            title: "Spell VFX Spritesheet Viewer",
            desc: "Preview generated spell-effect sprite sheets and their frame strips.",
            href: "Sprites/SpellVFX/spritesheet_viewer.html",
            file: "Sprites/SpellVFX/spritesheet_viewer.html",
            accent: "accent-amber",
            icon: "🔮",
            tags: ["spell", "vfx", "spritesheet", "viewer", "effect"],
          },
        ],
      },
      {
        name: "Game",
        tools: [
          {
            title: "Dungeon Crawlers — Play",
            desc: "Launch the game itself (title screen → new game → quests).",
            href: "index.html",
            file: "index.html",
            accent: "accent-green",
            icon: "⚔️",
            tags: ["game", "play", "main", "dungeon", "crawlers"],
          },
        ],
      },
    ];

    const gridsEl = document.getElementById("grids");
    const filterEl = document.getElementById("filter");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");

    let allTools = [];
    GROUPS.forEach((group) => {
      const sec = document.createElement("section");
      sec.className = "group";
      sec.dataset.group = group.name;
      const h2 = document.createElement("h2");
      h2.textContent = group.name;
      const grid = document.createElement("div");
      grid.className = "grid";
      group.tools.forEach((tool) => {
        const card = document.createElement("a");
        card.className = "card " + tool.accent;
        card.href = tool.href;
        card.target = "_blank";
        card.rel = "noopener";
        card.dataset.search = (tool.title + " " + tool.desc + " " + tool.tags.join(" ") + " " + tool.file).toLowerCase();

        const top = document.createElement("div");
        top.className = "card-top";
        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = tool.icon;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = (tool.tags[0] || "tool").toUpperCase();
        top.append(icon, tag);

        const h3 = document.createElement("h3");
        h3.textContent = tool.title;
        const p = document.createElement("p");
        p.textContent = tool.desc;
        const file = document.createElement("div");
        file.className = "file";
        file.textContent = tool.file;
        const go = document.createElement("div");
        go.className = "go";
        go.textContent = "OPEN →";

        card.append(top, h3, p, file, go);
        grid.appendChild(card);
        allTools.push({ card, search: card.dataset.search, groupName: group.name });
      });
      sec.append(h2, grid);
      gridsEl.appendChild(sec);
    });

    function render() {
      const q = filterEl.value.trim().toLowerCase();
      let visible = 0;
      allTools.forEach((t) => {
        const match = !q || t.search.includes(q);
        t.card.style.display = match ? "" : "none";
        if (match) visible++;
      });
      GROUPS.forEach((g) => {
        const sec = gridsEl.querySelector(`[data-group="${g.name}"]`);
        const anyVisible = allTools.filter((t) => t.groupName === g.name && t.card.style.display !== "none").length;
        sec.style.display = anyVisible ? "" : "none";
      });
      emptyEl.style.display = visible ? "none" : "block";
      countEl.textContent = visible + (visible === 1 ? " tool" : " tools");
    }

    filterEl.addEventListener("input", render);
    render();
  </script>
</body>
</html>
