<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill & Animation Test Environment</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #090a10;
        color: #c8ccd8;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        height: 100vh;
        user-select: none;
      }
      canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
      canvas:active { cursor: grabbing; }

      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        background: rgba(10, 12, 20, 0.92);
        border-bottom: 1px solid #252a3d;
        backdrop-filter: blur(10px);
        flex-wrap: wrap;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      #toolbar label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #9098b0;
        cursor: pointer;
      }
      #toolbar select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #2a3048;
        background: #131724;
        color: #dce2f0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
      }
      #toolbar select:hover { border-color: #3b466b; background: #171c2d; }
      #toolbar select:focus { border-color: #5873e8; }
      #skill-select { min-width: 210px; font-weight: 600; color: #ffd875; }

      #toolbar button {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #4a65d8;
        background: linear-gradient(180deg, #3d58cc 0%, #2b44aa 100%);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(43, 68, 170, 0.4);
        transition: all 0.15s ease;
      }
      #toolbar button:hover {
        background: linear-gradient(180deg, #4d68dc 0%, #3b54ba 100%);
        border-color: #6682f0;
        box-shadow: 0 3px 12px rgba(43, 68, 170, 0.6);
      }
      #toolbar button:active {
        transform: translateY(1px);
        background: #233990;
      }
      #toolbar button.secondary {
        background: #171b2a;
        border: 1px solid #2a3048;
        color: #a4b0d0;
        box-shadow: none;
      }
      #toolbar button.secondary:hover {
        background: #20263a;
        border-color: #3f4a6e;
        color: #fff;
      }

      #toolbar input[type="range"] { width: 65px; accent-color: #4a65d8; }
      #skill-name {
        font-size: 12px;
        font-weight: 600;
        color: #e2c068;
        padding: 5px 10px;
        background: #131624;
        border-radius: 5px;
        border: 1px solid #2b324c;
        min-width: 110px;
        text-align: center;
      }
      #toolbar .sep {
        width: 1px;
        height: 22px;
        background: #252a3d;
        margin: 0 2px;
      }
      #loop-cb, #sfx-cb { accent-color: #4a65d8; cursor: pointer; }

      #info {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 12px;
        color: #98a2c0;
        text-align: center;
        pointer-events: none;
        background: rgba(10, 12, 20, 0.85);
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid #282f46;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }
      #info strong { color: #e2c068; }
      #info span.hint { color: #6a769a; margin-left: 8px; font-size: 11px; }

      /* Controls overlay hint at top right */
      #cam-hints {
        position: fixed;
        top: 54px;
        right: 16px;
        z-index: 9;
        font-size: 11px;
        color: #727d9a;
        background: rgba(10, 12, 20, 0.75);
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #222738;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #cam-hints span { display: flex; align-items: center; gap: 6px; }
      #cam-hints kbd {
        background: #181c2b;
        border: 1px solid #2d3652;
        border-radius: 3px;
        padding: 1px 4px;
        color: #b0bad6;
        font-family: monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label for="skill-select">Skill:</label>
      <select id="skill-select"></select>
      <span id="skill-name">—</span>
      <button id="play-btn">▶ Play VFX</button>

      <div class="sep"></div>

      <label for="attacker-select">Attacker:</label>
      <select id="attacker-select">
        <option value="wizard">Wizard (Human)</option>
        <option value="fighter" selected>Fighter (Dwarf)</option>
        <option value="rogue">Rogue (Elf)</option>
        <option value="cleric">Cleric (Human)</option>
        <option value="ranger">Ranger (Half-Elf)</option>
        <option value="paladin">Paladin (Human)</option>
        <option value="warlock">Warlock (Tiefling)</option>
        <option value="goblin">Goblin (Monster)</option>
        <option value="skeleton">Skeleton (Monster)</option>
        <option value="dragon">Red Dragon (Boss)</option>
      </select>

      <label for="target-select">Target:</label>
      <select id="target-select">
        <option value="dummy" selected>Training Dummy</option>
        <option value="fighter">Fighter (Hero)</option>
        <option value="goblin">Goblin Minion</option>
        <option value="skeleton">Skeleton Warrior</option>
        <option value="orc">Orc Berserker</option>
        <option value="beholder">Beholder (Boss)</option>
      </select>

      <div class="sep"></div>

      <label for="theme-select">Theme:</label>
      <select id="theme-select">
        <option value="ancient" selected>Ancient Stone</option>
        <option value="necropolis">Crypt / Necropolis</option>
        <option value="inferno">Inferno / Lava</option>
        <option value="overgrown">Overgrown / Forest</option>
      </select>

      <label for="cam-preset">View:</label>
      <select id="cam-preset">
        <option value="iso" selected>Isometric</option>
        <option value="front">Front View</option>
        <option value="top">Top Down</option>
        <option value="close">Close Up</option>
      </select>

      <button id="reset-cam-btn" class="secondary" title="Reset camera angle and zoom">📷 Reset Cam</button>

      <div class="sep"></div>

      <label><input type="checkbox" id="loop-cb" checked> Loop</label>
      <label>Interval <input type="range" id="interval" min="1" max="10" value="4" step="0.5"> <span id="interval-val">4.0s</span></label>

      <div class="sep"></div>

      <label><input type="checkbox" id="sfx-cb" checked> 🔊 Sound</label>
      <label><input type="checkbox" id="both-cb"> Dual VFX</label>
    </div>

    <div id="cam-hints">
      <span><kbd>RMB / Shift+LMB Drag</kbd> Rotate Camera</span>
      <span><kbd>LMB Drag</kbd> Pan View</span>
      <span><kbd>Scroll Wheel</kbd> Zoom In / Out</span>
    </div>

    <div id="info">
      Selected Skill: <strong id="info-skill-label">—</strong>
      <span class="hint">Click Play or spacebar to execute attack & VFX.</span>
    </div>

    <script type="module" src="./src/test_skills.js"></script>
  </body>
</html>
