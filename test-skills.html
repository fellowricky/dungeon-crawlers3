<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFX Animation Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #090a10;
        color: #c8ccd8;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        height: 100vh;
        user-select: none;
      }
      canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; }
      canvas:active { cursor: grabbing; }

      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        background: rgba(10, 12, 20, 0.92);
        border-bottom: 1px solid #252a3d;
        backdrop-filter: blur(10px);
        flex-wrap: wrap;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      #toolbar label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #9098b0; cursor: pointer; }
      #toolbar select, #editor-panel select {
        padding: 6px 10px; border-radius: 6px; border: 1px solid #2a3048;
        background: #131724; color: #dce2f0; font-size: 12px; font-weight: 500;
        cursor: pointer; outline: none; transition: border-color 0.15s, background 0.15s;
      }
      #toolbar select:hover, #editor-panel select:hover { border-color: #3b466b; background: #171c2d; }
      #toolbar select:focus, #editor-panel select:focus { border-color: #5873e8; }
      #anim-select { min-width: 150px; font-weight: 600; color: #ffd875; }

      #toolbar button, #editor-panel button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #4a65d8;
        background: linear-gradient(180deg, #3d58cc 0%, #2b44aa 100%);
        color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        box-shadow: 0 2px 8px rgba(43, 68, 170, 0.4); transition: all 0.15s ease;
      }
      #toolbar button:hover, #editor-panel button:hover { background: linear-gradient(180deg, #4d68dc 0%, #3b54ba 100%); border-color: #6682f0; }
      #toolbar button:active, #editor-panel button:active { transform: translateY(1px); background: #233990; }
      #toolbar button.secondary, #editor-panel button.secondary { background: #171b2a; border: 1px solid #2a3048; color: #a4b0d0; box-shadow: none; }
      #toolbar button.secondary:hover, #editor-panel button.secondary:hover { background: #20263a; border-color: #3f4a6e; color: #fff; }

      #toolbar input[type="range"] { width: 60px; accent-color: #4a65d8; }
      #toolbar input[type="text"] {
        padding: 5px 8px; border-radius: 6px; border: 1px solid #2a3048;
        background: #131724; color: #dce2f0; font-size: 12px; outline: none;
      }
      #toolbar .sep { width: 1px; height: 22px; background: #252a3d; margin: 0 2px; }
      #toolbar input[type="checkbox"], #editor-panel input[type="checkbox"] { accent-color: #4a65d8; cursor: pointer; }

      #info {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
        font-size: 12px; color: #98a2c0; text-align: center; pointer-events: none;
        background: rgba(10, 12, 20, 0.85); padding: 8px 18px; border-radius: 8px;
        border: 1px solid #282f46; backdrop-filter: blur(8px);
      }
      #info strong { color: #e2c068; }
      #info span.hint { color: #6a769a; margin-left: 8px; font-size: 11px; }

      #cam-hints {
        position: fixed; top: 54px; right: 564px; z-index: 9; font-size: 11px; color: #727d9a;
        background: rgba(10, 12, 20, 0.75); padding: 6px 12px; border-radius: 6px;
        border: 1px solid #222738; pointer-events: none; display: flex; flex-direction: column; gap: 2px;
      }
      #cam-hints span { display: flex; align-items: center; gap: 6px; }
      #cam-hints kbd { background: #181c2b; border: 1px solid #2d3652; border-radius: 3px; padding: 1px 4px; color: #b0bad6; font-family: monospace; font-size: 10px; }

      /* ── editor panel ── */
      #editor-panel {
        position: fixed; top: 52px; right: 12px; bottom: 12px; width: 540px; z-index: 8;
        background: rgba(12, 14, 22, 0.94); border: 1px solid #252a3d; border-radius: 10px;
        backdrop-filter: blur(10px); padding: 12px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 10px; user-select: text;
      }
      #editor-panel h2 { font-size: 13px; font-weight: 700; color: #e2c068; letter-spacing: 0.03em; }
      #editor-panel h3 { font-size: 11px; font-weight: 700; color: #8fa0c8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
      #editor-panel .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aab4d0; flex-wrap: wrap; }
      #editor-panel .row label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
      #editor-panel .row input[type="number"], #editor-panel .row input[type="text"] {
        width: 64px; padding: 4px 6px; border-radius: 6px; border: 1px solid #2a3048;
        background: #131724; color: #dce2f0; font-size: 12px; outline: none;
      }
      #editor-panel .row input[type="range"] { width: 90px; accent-color: #4a65d8; }
      #editor-panel .row input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid #2a3048; background: none; border-radius: 5px; cursor: pointer; }
      #editor-panel .section { border: 1px solid #232a40; border-radius: 8px; padding: 8px; background: rgba(18, 21, 34, 0.5); }
      #editor-panel .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }

      details.layer { border: 1px solid #2a3048; border-radius: 8px; background: #141827; overflow: hidden; }
      details.layer summary {
        display: flex; align-items: center; gap: 8px; padding: 7px 9px; cursor: pointer;
        list-style: none; font-size: 12px; font-weight: 600; color: #c6cede;
      }
      details.layer summary::-webkit-details-marker { display: none; }
      details.layer summary .layer-title { flex: 1; }
      details.layer summary select { margin-left: auto; }
      details.layer[open] summary { border-bottom: 1px solid #252a3d; }
      .layer-body { padding: 9px; display: flex; flex-direction: column; gap: 8px; }
      .layer-body .type-controls { display: flex; flex-direction: column; gap: 8px; }
      .layer-body .trow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9aa4c0; }
      .layer-body .trow label { display: flex; align-items: center; gap: 5px; min-width: 74px; }
      .layer-body .trow select { flex: 1; }
      .layer-body .trow input[type="number"] { width: 60px; }
      .layer-body .trow input[type="text"] { flex: 1; }
      .layer-body .trow input[type="range"] { flex: 1; }
      .layer-solo {
        margin-left: 4px; background: #171b2a !important; border: 1px solid #2a3048 !important;
        color: #7d88a8 !important; padding: 3px 7px !important; font-size: 11px !important;
      }
      .layer-solo.active { background: #3d58cc !important; color: #fff !important; border-color: #4a65d8 !important; }
      .status { font-size: 11px; color: #6a9a6a; min-height: 14px; }
      .status.err { color: #c87870; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label for="anim-select">Animation:</label>
      <select id="anim-select"></select>
      <span id="anim-name" style="font-size:12px;color:#e2c068;min-width:90px;">—</span>
      <button id="play-btn" title="Play (Space)">▶ Play</button>
      <label><input type="checkbox" id="loop-cb" checked> Loop</label>
      <label>Interval <input type="range" id="interval" min="1" max="10" value="4" step="0.5"> <span id="interval-val">4.0s</span></label>
      <label><input type="checkbox" id="skip-travel-cb" title="Instantly show the impact, no flight"> Instant impact</label>
      <label><input type="checkbox" id="area-cb" checked title="Outline the spell's real area of effect on the floor"> Hit area</label>
      <label><input type="checkbox" id="sfx-cb" checked> 🔊 Sound</label>

      <div class="sep"></div>

      <label for="level-select" title="The caster's level: Eldritch Blast throws more bolts as it rises">Lv</label>
      <select id="level-select">
        <option value="1" selected>1</option>
        <option value="5">5</option>
        <option value="11">11</option>
        <option value="17">17</option>
      </select>
      <label for="attacker-select">Caster:</label>
      <select id="attacker-select">
        <option value="wizard" selected>Wizard</option>
        <option value="sorcerer">Sorcerer</option>
        <option value="cleric">Cleric</option>
        <option value="druid">Druid</option>
        <option value="warlock">Warlock</option>
        <option value="fighter">Fighter</option>
      </select>

      <label for="target-select">Target:</label>
      <select id="target-select">
        <option value="hobgoblin-ironback" selected>Red-Banner Ironback</option>
        <option value="dummy">Training Dummy</option>
        <option value="orc">Orc Berserker</option>
        <option value="great-orb-of-eyes">Great Orb of Eyes</option>
      </select>
      <label for="status-select" title="Put a status on the targets to review its aura on their real sprites">Status:</label>
      <select id="status-select"><option value="" selected>none</option></select>
      <label for="targets-select" title="Extra targets of the same kind beside the first, to see area and multi-target spells land">×</label>
      <select id="targets-select">
        <option value="1" selected>1</option>
        <option value="3">3</option>
      </select>

      <div class="sep"></div>

      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
      <button id="reroll-btn" class="secondary" title="Forge a new layout in this theme">🎲 New layout</button>

      <label for="cam-preset">View:</label>
      <select id="cam-preset">
        <option value="iso" selected>Isometric</option>
        <option value="front">Front</option>
        <option value="top">Top</option>
        <option value="close">Close Up</option>
      </select>

      <button id="reset-cam-btn" class="secondary" title="Reset camera">📷 Reset</button>
    </div>

    <div id="editor-panel">
      <h2>⚙ VFX Animation Editor</h2>

      <div class="section">
        <h3>Animation</h3>
        <div class="row">
          <label>Name <input type="text" id="anim-name-input" /></label>
        </div>
        <div class="btn-row" style="margin-top:6px;">
          <button id="anim-new" class="secondary">＋ New</button>
          <button id="anim-dup" class="secondary">⧉ Duplicate</button>
          <button id="anim-del" class="secondary">🗑 Delete</button>
        </div>
      </div>

      <div class="section">
        <h3>Travel</h3>
        <div class="row">
          <label>Duration <input type="range" id="travel-dur" min="0.1" max="2" step="0.05" /> <span id="travel-dur-val">0.6s</span></label>
        </div>
        <div class="row">
          <label>Arc <input type="range" id="travel-arc" min="0" max="2" step="0.05" /> <span id="travel-arc-val">0.0</span></label>
        </div>
      </div>

      <div class="section">
        <h3>Audio</h3>
        <div class="row">
          <label>Travel <select id="travel-sound"></select></label>
          <button id="play-travel-sound" class="secondary" title="Audition">▶</button>
        </div>
        <div class="row" style="margin-top:6px;">
          <label>Impact <select id="impact-sound"></select></label>
          <button id="play-impact-sound" class="secondary" title="Audition">▶</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <label>SFX <input type="range" id="sfx-vol" min="0" max="1" step="0.05" /> <span id="sfx-vol-val">0.80</span></label>
          <button id="test-sound" class="secondary" title="Play the impact SFX at current volume">Test</button>
        </div>
      </div>

      <div class="section" id="layers-section">
        <h3>Layers</h3>
        <div id="layers-container" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

      <div class="section">
        <h3>Project</h3>
        <div class="btn-row">
          <button id="save-btn">💾 Save to Project</button>
          <button id="download-btn" class="secondary">⬇ Download</button>
          <button id="load-btn" class="secondary">⬆ Load JSON</button>
          <input type="file" id="load-file" accept="application/json" style="display:none;" />
        </div>
        <div class="status" id="save-status"></div>
      </div>
    </div>

    <div id="cam-hints">
      <span><kbd>RMB / Shift+LMB</kbd> Rotate</span>
      <span><kbd>LMB</kbd> Pan</span>
      <span><kbd>Scroll</kbd> Zoom</span>
      <span><kbd>Space</kbd> Play</span>
    </div>

    <div id="info">
      Selected: <strong id="info-label">—</strong>
      <span class="hint">Layers are depth-stacked: BACK under FRONT.</span>
    </div>

    <script type="module" src="./src/vfx_editor.js"></script>
  </body>
</html>
