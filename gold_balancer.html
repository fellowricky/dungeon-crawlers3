<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Balancer & Loot Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #07080d;
      --card-bg: rgba(18, 20, 30, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #e2e4f0;
      --text-muted: #8e95b0;
      --primary: #d9a441;
      --primary-hover: #fcd34d;
      --primary-glow: rgba(217, 164, 65, 0.2);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gold: #d9a441;
      --violet: #9b6cf0;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 2rem;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(217, 164, 65, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(155, 108, 240, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    header {
      grid-column: 1 / -1;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .btn-game-link {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-game-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .range-val {
      float: right;
      color: var(--primary);
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      margin-top: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary-glow);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .btn-run {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      background: var(--primary);
      color: #000;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px var(--primary-glow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-run:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(253, 211, 77, 0.3);
      transform: translateY(-1px);
    }

    .main-view {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .chart-container {
      position: relative;
      height: 380px;
      width: 100%;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .metric-card:hover {
      border-color: rgba(217, 164, 65, 0.3);
    }

    .metric-val {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0.25rem 0;
    }

    .metric-val.gold { color: var(--gold); }
    .metric-val.violet { color: var(--violet); }
    .metric-val.blue { color: var(--blue); }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }

    .tab-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(217, 164, 65, 0.1);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Gold Balancer & Loot Simulator</h1>
      <div class="subtitle">Analyze gold and equipment value scaling across dungeon levels and floors</div>
    </div>
    <a href="./index.html" class="btn-game-link">← Return to Game</a>
  </header>

  <div class="container">
    <!-- Sidebar Controls -->
    <aside class="card">
      <div class="card-title">Simulation Settings</div>
      
      <div class="form-group">
        <label>Sweep Variable</label>
        <select id="sweepVar">
          <option value="dungeonLevel">Dungeon / Level (1 - 20)</option>
          <option value="floors">Number of Floors (1 - 10)</option>
          <option value="partyLevel">Party Average Level (1 - 20)</option>
        </select>
      </div>

      <div class="form-group" id="group-partyLevel">
        <label>Constant Party Level <span class="range-val" id="val-partyLevel">10</span></label>
        <input type="range" id="partyLevel" min="1" max="20" value="10">
      </div>

      <div class="form-group" id="group-dungeonLevel">
        <label>Constant Dungeon Level <span class="range-val" id="val-dungeonLevel">10</span></label>
        <input type="range" id="dungeonLevel" min="1" max="20" value="10">
      </div>

      <div class="form-group" id="group-floors">
        <label>Constant Floors <span class="range-val" id="val-floors">5</span></label>
        <input type="range" id="floors" min="1" max="10" value="5">
      </div>

      <div class="form-group">
        <label>Skill Challenge Strategy</label>
        <select id="challengeStrategy">
          <option value="safe">Always Safe (Low Risk/Half Reward)</option>
          <option value="standard" selected>Always Standard (Normal)</option>
          <option value="risky">Always Risky (High Risk/Double Reward)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Simulation Runs <span class="range-val" id="val-runs">100</span></label>
        <input type="range" id="runs" min="20" max="300" step="10" value="100">
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="hasThief" checked>
        <label for="hasThief" style="margin-bottom: 0; cursor: pointer;">Party Has Thief (+25% Chest Gold)</label>
      </div>

      <div class="form-group checkbox-group" style="margin-top: 0.5rem;">
        <input type="checkbox" id="noMonsterGold">
        <label for="noMonsterGold" style="margin-bottom: 0; cursor: pointer;">Remove Monster Gold Drops</label>
      </div>

      <button class="btn-run" id="btnRun">Run Simulation</button>
    </aside>

    <!-- Main Results View -->
    <main class="main-view">
      <!-- Chart Card -->
      <section class="card">
        <div class="card-title">Gold Income Curves</div>
        <div class="chart-container">
          <canvas id="incomeChart"></canvas>
        </div>
      </section>

      <!-- Key Metrics Card -->
      <section class="card">
        <div class="card-title">Averages at Median Sweep Point</div>
        <div class="metrics-grid">
          <div class="metric-card">
            <label>Direct Gold Earned</label>
            <div class="metric-val gold" id="metric-direct">0g</div>
            <span class="subtitle">Chests, rewards, slays</span>
          </div>
          <div class="metric-card">
            <label>Equipment Resale Value</label>
            <div class="metric-val violet" id="metric-resale">0g</div>
            <span class="subtitle">Reselling gear & dyes</span>
          </div>
          <div class="metric-card">
            <label>Total Income</label>
            <div class="metric-val blue" id="metric-total">0g</div>
            <span class="subtitle">Combined gold value</span>
          </div>
        </div>
      </section>

      <!-- Detailed Data Table -->
      <section class="card">
        <div class="card-title">Source Data Table</div>
        <div class="table-container">
          <table id="dataTable">
            <thead>
              <tr id="tableHeaders">
                <!-- Dynamic headers -->
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Dynamic rows -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    // Minimal stub for DOM modules in quests/items loader
    if (!globalThis.document.body.appendChild) {
      globalThis.document.body = { appendChild() {} };
    }

    import { simulateQuestRun } from './simulate_gold.mjs';

    // UI state elements
    const sweepVar = document.getElementById('sweepVar');
    const btnRun = document.getElementById('btnRun');
    const challengeStrategy = document.getElementById('challengeStrategy');
    const hasThief = document.getElementById('hasThief');
    const noMonsterGold = document.getElementById('noMonsterGold');
    const runsInput = document.getElementById('runs');

    const sliders = {
      partyLevel: document.getElementById('partyLevel'),
      dungeonLevel: document.getElementById('dungeonLevel'),
      floors: document.getElementById('floors')
    };

    // Update range labels on input
    Object.keys(sliders).forEach(key => {
      sliders[key].addEventListener('input', (e) => {
        document.getElementById(`val-${key}`).textContent = e.target.value;
      });
    });
    runsInput.addEventListener('input', (e) => {
      document.getElementById('val-runs').textContent = e.target.value;
    });

    // Control visibility of controls based on sweep variable selection
    function updateControlVisibility() {
      const selected = sweepVar.value;
      document.getElementById('group-partyLevel').style.display = selected === 'partyLevel' ? 'none' : 'block';
      document.getElementById('group-dungeonLevel').style.display = selected === 'dungeonLevel' ? 'none' : 'block';
      document.getElementById('group-floors').style.display = selected === 'floors' ? 'none' : 'block';
    }
    sweepVar.addEventListener('change', updateControlVisibility);
    updateControlVisibility();

    // Chart.js object holder
    let chartInstance = null;

    // Simulation Sweeper
    function runSimulation() {
      const sweep = sweepVar.value;
      const runs = parseInt(runsInput.value, 10);
      const thiefVal = hasThief.checked;
      const noMonGoldVal = noMonsterGold.checked;
      const strategy = challengeStrategy.value;

      // Read constants based on sweep choice
      const constPartyLvl = parseInt(sliders.partyLevel.value, 10);
      const constDungeonLvl = parseInt(sliders.dungeonLevel.value, 10);
      const constFloors = parseInt(sliders.floors.value, 10);

      let sweepRange = [];
      let xLabel = '';

      if (sweep === 'dungeonLevel') {
        sweepRange = Array.from({ length: 20 }, (_, i) => i + 1);
        xLabel = 'Dungeon Level';
      } else if (sweep === 'partyLevel') {
        sweepRange = Array.from({ length: 20 }, (_, i) => i + 1);
        xLabel = 'Party Average Level';
      } else { // floors
        sweepRange = Array.from({ length: 10 }, (_, i) => i + 1);
        xLabel = 'Number of Floors';
      }

      const results = [];

      // Run simulation sweeps
      sweepRange.forEach(val => {
        const pl = sweep === 'partyLevel' ? val : constPartyLvl;
        const dl = sweep === 'dungeonLevel' ? val : constDungeonLvl;
        const fl = sweep === 'floors' ? val : constFloors;

        let sumDirect = 0;
        let sumLoot = 0;
        let sumTotal = 0;
        const breakdownSum = {};

        for (let r = 0; r < runs; r++) {
          const sim = simulateQuestRun(pl, dl, fl, {
            hasThief: thiefVal,
            challengeStrategy: strategy,
            noMonsterGold: noMonGoldVal
          });
          sumDirect += sim.directGold;
          sumLoot += sim.equipmentValue;
          sumTotal += sim.totalIncome;

          for (const key in sim.breakdown) {
            breakdownSum[key] = (breakdownSum[key] || 0) + sim.breakdown[key];
          }
        }

        const avgDirect = Math.round(sumDirect / runs);
        const avgLoot = Math.round(sumLoot / runs);
        const avgTotal = Math.round(sumTotal / runs);

        const breakdown = {};
        for (const key in breakdownSum) {
          breakdown[key] = Math.round(breakdownSum[key] / runs);
        }

        results.push({
          x: val,
          direct: avgDirect,
          loot: avgLoot,
          total: avgTotal,
          breakdown
        });
      });

      // Update Key Metrics Cards (from median sweep point)
      const medianIdx = Math.floor(results.length / 2);
      const medianPoint = results[medianIdx];
      document.getElementById('metric-direct').textContent = `${medianPoint.direct.toLocaleString()}g`;
      document.getElementById('metric-resale').textContent = `${medianPoint.loot.toLocaleString()}g`;
      document.getElementById('metric-total').textContent = `${medianPoint.total.toLocaleString()}g`;

      // Update Chart
      renderChart(xLabel, results);

      // Update Table
      renderTable(xLabel, results);
    }

    function renderChart(xLabel, results) {
      const labels = results.map(r => r.x);
      const directData = results.map(r => r.direct);
      const lootData = results.map(r => r.loot);
      const totalData = results.map(r => r.total);

      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById('incomeChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Total Income',
              data: totalData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              borderWidth: 3,
              fill: true,
              tension: 0.15
            },
            {
              label: 'Direct Gold Earned',
              data: directData,
              borderColor: '#d9a441',
              backgroundColor: 'transparent',
              borderWidth: 2,
              tension: 0.15
            },
            {
              label: 'Equipment Resale Value',
              data: lootData,
              borderColor: '#9b6cf0',
              backgroundColor: 'transparent',
              borderWidth: 2,
              tension: 0.15
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#e2e4f0',
                font: { family: 'Outfit', size: 12 }
              }
            }
          },
          scales: {
            x: {
              title: { display: true, text: xLabel, color: '#8e95b0', font: { family: 'Outfit', size: 13, weight: 600 } },
              ticks: { color: '#8e95b0', font: { family: 'Outfit' } },
              grid: { color: 'rgba(255, 255, 255, 0.05)' }
            },
            y: {
              title: { display: true, text: 'Gold Value (g)', color: '#8e95b0', font: { family: 'Outfit', size: 13, weight: 600 } },
              ticks: { color: '#8e95b0', font: { family: 'Outfit' }, callback: v => `${v.toLocaleString()}g` },
              grid: { color: 'rgba(255, 255, 255, 0.05)' }
            }
          }
        }
      });
    }

    function renderTable(xLabel, results) {
      const headers = document.getElementById('tableHeaders');
      const body = document.getElementById('tableBody');

      headers.innerHTML = `
        <th>${xLabel}</th>
        <th>Direct Gold</th>
        <th>Gear Resale</th>
        <th>Total Income</th>
        <th>Monster Gold</th>
        <th>Chest Gold</th>
        <th>Quest Gold</th>
        <th>Chest Gear Value</th>
      `;

      body.innerHTML = '';
      results.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${r.x}</strong></td>
          <td>${r.direct.toLocaleString()}g</td>
          <td>${r.loot.toLocaleString()}g</td>
          <td><strong>${r.total.toLocaleString()}g</strong></td>
          <td>${r.breakdown.monsterGold.toLocaleString()}g</td>
          <td>${r.breakdown.chestGold.toLocaleString()}g</td>
          <td>${r.breakdown.questRewardGold.toLocaleString()}g</td>
          <td>${r.breakdown.chestLootVal.toLocaleString()}g</td>
        `;
        body.appendChild(row);
      });
    }

    btnRun.addEventListener('click', runSimulation);
    // Initial run
    runSimulation();
  </script>
</body>
</html>
